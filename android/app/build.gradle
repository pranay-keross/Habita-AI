apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Add the Google services Gradle plugin
apply plugin: "com.google.gms.google-services"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Release signing, loaded from outside version control so no secret ever lives
 * in a committed file:
 *   1. Environment variables (RELEASE_STORE_FILE/RELEASE_STORE_PASSWORD/
 *      RELEASE_KEY_ALIAS/RELEASE_KEY_PASSWORD) — for CI, where secrets are
 *      injected at build time rather than checked out.
 *   2. android/keystore.properties (gitignored; copy keystore.properties.example
 *      and fill in your real values) — for a local release build.
 * If neither is fully set up, release builds fall back to the debug keystore
 * (with a loud warning below) so `assembleRelease` still succeeds out of the
 * box for local testing — it just must never be the thing you actually ship.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def releaseStoreFile = System.getenv("RELEASE_STORE_FILE") ?: keystoreProperties["RELEASE_STORE_FILE"]
def releaseStorePassword = System.getenv("RELEASE_STORE_PASSWORD") ?: keystoreProperties["RELEASE_STORE_PASSWORD"]
def releaseKeyAlias = System.getenv("RELEASE_KEY_ALIAS") ?: keystoreProperties["RELEASE_KEY_ALIAS"]
def releaseKeyPassword = System.getenv("RELEASE_KEY_PASSWORD") ?: keystoreProperties["RELEASE_KEY_PASSWORD"]

def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword &&
    file(releaseStoreFile).exists()

if (!hasReleaseSigning) {
    logger.warn("\n" +
        "⚠️  No release keystore configured for :app — release builds will be signed\n" +
        "   with the DEBUG keystore. Fine for local testing; never ship this build.\n" +
        "   See android/keystore.properties.example to set up real release signing.\n")
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.sahelicli"
    defaultConfig {
        applicationId "com.sahelicli"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            // See the hasReleaseSigning block above: this is the debug keystore
            // only when no real release keystore has been configured yet.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }

    externalNativeBuild {
        cmake {
            // Windows only: CMake/NDK intermediate paths nested under node_modules
            // (react-native-reanimated, react-native-worklets, etc.) can exceed
            // Windows' 260-char MAX_PATH. Redirect to a short path outside the repo.
            // A no-op on macOS/Linux CI, where this isn't a problem.
            if (System.getProperty("os.name").toLowerCase().contains("windows")) {
                buildStagingDirectory file("C:/tmp/cxx")
            }
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:34.17.0')

    // When using the BoM, don't specify versions in Firebase dependencies
    implementation 'com.google.firebase:firebase-analytics'

    // Required to receive a push at all — the pre-existing setup was
    // analytics-only, which cannot deliver messages (docs/DECISIONS.md D-059).
    implementation 'com.google.firebase:firebase-messaging'

    // Google ML Kit Barcode Scanning (bundled model, works offline on device)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // CameraX for Live Real-Time Hardware Barcode Scanning
    def camerax_version = "1.4.2"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
}
