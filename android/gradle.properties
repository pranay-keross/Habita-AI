# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# NOTE on JDK selection: do NOT pin org.gradle.java.home to an absolute path in
# this file. It's tracked in git and an absolute path is machine-specific — it
# would silently break the build for every other developer/CI runner whose JDK
# lives somewhere else. The portable, project-level fix lives in
# gradle/gradle-daemon-jvm.properties (a version+vendor constraint Gradle can
# match or auto-provision on any machine); a one-off local override belongs in
# your own user-level ~/.gradle/gradle.properties, never here. See
# docs/ANDROID_BUILD_TROUBLESHOOTING.md and
# https://docs.gradle.org/current/userguide/upgrading_version_8.html#daemon_jvm_criteria

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# Reuse task outputs across builds (biggest win on rebuilds).
org.gradle.caching=true

# Skip the configuration phase entirely when nothing in the build scripts changed.
org.gradle.configuration-cache=true

# NOTE: org.gradle.configureondemand must stay OFF. It configures only the
# projects needed for the requested task, so :notifee_react-native never runs
# its `rootProject.allprojects { repositories { maven { ... } } }` block that
# registers the bundled app.notifee:core repo. Result:
#   Could not find any matches for app.notifee:core:+
org.gradle.configureondemand=false

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# Universal build (all 4 ABIs) so the same APK installs on real devices
# (arm64-v8a, armeabi-v7a) and emulators (x86_64, x86) without per-run overrides.
# Slower than a single-ABI build since native/CMake work is multiplied by 4 -
# narrow to one ABI on the command line for a faster iteration build:
#   ./gradlew assembleDebug -PreactNativeArchitectures=x86_64
reactNativeArchitectures=arm64-v8a,armeabi-v7a,x86,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=false


# Kotlin compiles in a reusable daemon process instead of in-process.
kotlin.incremental=true
kapt.incremental.apt=true

# Skip building unused resource/BuildConfig artifacts.
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
